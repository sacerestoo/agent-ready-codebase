<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta
      name="theme-color"
      content="#fff"
    />
    <title>Page not found</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #fff;
        color: #171717;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background: #fff;
      }

      main {
        width: min(100%, 460px);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 6vw, 1.5rem);
        font-weight: 600;
        letter-spacing: -0.04em;
      }

      p {
        max-width: 300px;
        margin: 12px auto 26px;
        color: #666;
        font-size: 0.875rem;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        min-height: 32px;
        align-items: center;
        justify-content: center;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: #fff;
        box-shadow:
          0 0 0 0.5px transparent inset,
          0 0 0 0.5px rgb(0 0 0 / 6%),
          0 1px 1px -1px rgb(0 0 0 / 10%),
          0 1px 2px 0 rgb(0 0 0 / 5%);
        color: #171717;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        transition:
          background-color 140ms ease,
          color 140ms ease,
          transform 140ms ease;
      }

      a:hover {
        background: #f5f5f5;
      }
      a:active {
        transform: scale(0.98);
      }
      a:focus-visible {
        outline: 3px solid #8888;
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>The page you’re looking for may have moved or no longer exists.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
