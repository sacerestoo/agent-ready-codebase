name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Prepare placeholder environment
        run: printf '%s\n' 'DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres' > .env
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
